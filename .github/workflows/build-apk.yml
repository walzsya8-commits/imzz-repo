
name: Build IMZYY KNOX Game Turbo APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate and Extract Project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" -print -quit)

          if [ -n "$ZIP_FILE" ]; then
            unzip -oq "$ZIP_FILE" -d ./_project
          fi

          SETTINGS=$(find . \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path './.git/*' \
            -not -path './.gradle/*' -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle tidak ditemukan!"
            exit 1
          fi

          DIR=$(dirname "$SETTINGS")

          if [ ! -d "$DIR/app" ]; then
            echo "ERROR: Folder app tidak ditemukan!"
            exit 1
          fi

          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project: $DIR"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "ERROR: Android SDK tidak ditemukan!"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager -print -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan!"
            exit 1
          fi

          APP="$PROJECT_DIR/app"

          COMPILE_SDK=$(
            grep -hEo 'compileSdk(Version)?[[:space:]()]*(=)?[[:space:]]*[0-9]+' \
            "$APP"/build.gradle "$APP"/build.gradle.kts 2>/dev/null |
            grep -Eo '[0-9]+' | tail -1 || true
          )

          if [ -z "$COMPILE_SDK" ]; then
            COMPILE_SDK=35
          fi

          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses || true

          "$SDKMANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-$COMPILE_SDK"

      - name: Detect Gradle Wrapper
        shell: bash
        run: |
          if [ -f "$PROJECT_DIR/gradlew" ]; then
            echo "GRADLE_FALLBACK=false" >> "$GITHUB_ENV"
            echo "Gradle Wrapper ditemukan."
          else
            echo "GRADLE_FALLBACK=true" >> "$GITHUB_ENV"
            echo "Wrapper tidak ditemukan. Menggunakan Gradle 8.9."
          fi

      - name: Setup Fallback Gradle
        if: env.GRADLE_FALLBACK == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -uo pipefail
          set +e

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug \
              --no-daemon --stacktrace --warning-mode all \
              2>&1 | tee "$GITHUB_WORKSPACE/build-log.txt"
            STATUS=${PIPESTATUS[0]}
          else
            gradle assembleDebug \
              --no-daemon --stacktrace --warning-mode all \
              2>&1 | tee "$GITHUB_WORKSPACE/build-log.txt"
            STATUS=${PIPESTATUS[0]}
          fi

          exit "$STATUS"

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IMZYY-Build-Log
          path: build-log.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: IMZYY-KNOX-GameTurbo-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30
