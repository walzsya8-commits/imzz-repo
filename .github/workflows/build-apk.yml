
name: Build IMZYY KNOX Game Turbo APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Locate and Extract Project
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -1)

          if [ -n "$ZIP" ]; then
            unzip -o -q "$ZIP"
          fi

          SETTINGS=$(find . \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.git/*' | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle tidak ditemukan!"
            exit 1
          fi

          DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project: $DIR"

      - name: Install Android SDK Components
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

          if [ -z "$SDK" ]; then
            echo "Android SDK tidak ditemukan!"
            exit 1
          fi

          echo "SDK=$SDK"

          SDKMANAGER=$(find "$SDK" -name sdkmanager -type f | head -1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager tidak ditemukan!"
            exit 1
          fi

          SETTINGS="$(
            find . -name settings.gradle -o -name settings.gradle.kts |
            grep -v '/.git/' | head -1
          )"

          DIR=$(dirname "$SETTINGS")
          APP="$DIR/app"

          COMPILE_SDK=$(
            grep -rhoE 'compileSdk(Version)?[[:space:]]*[= ]+[0-9]+' \
            "$APP" --include='*.gradle' --include='*.gradle.kts' |
            grep -oE '[0-9]+' | head -1
          )

          if [ -z "$COMPILE_SDK" ]; then
            COMPILE_SDK=35
          fi

          echo "Installing Android platform $COMPILE_SDK"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-$COMPILE_SDK"

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            echo "Gradle Wrapper tidak tersedia."
            echo "Menggunakan Gradle bawaan runner."
            gradle assembleDebug --no-daemon --stacktrace
          fi 2>&1 | tee build-log.txt

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IMZYY-Build-Logs
          path: ${{ env.PROJECT_DIR }}/build-log.txt
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: IMZYY-KNOX-GameTurbo-v5.1
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

